<!doctype html>
<html lang="en">
  <head>
    <!-- Must run first: ensure fetch API is available on all globals (fixes "Cannot destructure Request of undefined" in Firebase/deps) -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var w = window;
        var g = typeof globalThis !== 'undefined' ? globalThis : w;
        var s = typeof self !== 'undefined' ? self : w;
        if (w.Request) { g.Request = w.Request; s.Request = w.Request; }
        if (w.Response) { g.Response = w.Response; s.Response = w.Response; }
        if (w.Headers) { g.Headers = w.Headers; s.Headers = w.Headers; }
        if (w.fetch) { g.fetch = w.fetch; s.fetch = w.fetch; }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thakii Lecture2PDF - Convert Videos to PDF</title>
    <meta name="description" content="Transform lecture videos into structured PDF documents with AI-powered processing" />
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
