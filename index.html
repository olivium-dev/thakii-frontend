<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thakii Lecture2PDF - Convert Videos to PDF</title>
    <meta name="description" content="Transform lecture videos into structured PDF documents with AI-powered processing" />
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Ensure fetch API is on globalThis before any bundle runs (avoids "Cannot destructure Request of undefined") -->
    <script>
      (function() {
        var g = typeof globalThis !== 'undefined' ? globalThis : window;
        if (g && typeof window !== 'undefined') {
          if (!g.Request && window.Request) g.Request = window.Request;
          if (!g.Response && window.Response) g.Response = window.Response;
          if (!g.Headers && window.Headers) g.Headers = window.Headers;
          if (!g.fetch && window.fetch) g.fetch = window.fetch;
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
